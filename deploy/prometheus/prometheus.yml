global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics are intentionally not assumed until an explicit
  # /metrics endpoint is exposed by the backend.
  - job_name: advance-trading-system
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
