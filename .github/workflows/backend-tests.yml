name: Backend Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend development tools
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff lint
        working-directory: backend
        run: python -m ruff check src tests
      - name: Pytest
        working-directory: backend
        run: python -m pytest
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-validation-password
        run: docker compose config --quiet
      - name: Run Docker Compose runtime smoke test
        env:
          POSTGRES_PASSWORD: ci-runtime-password
          ATS_METRICS_PORT: 18000
          ATS_PROMETHEUS_PORT: 19090
          ATS_FRONTEND_PORT: 13000
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose up -d --build backend prometheus
          docker compose ps

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/metrics | grep -q '^ats_process_up 1'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Backend /metrics did not become ready.' >&2
              docker compose logs backend prometheus >&2 || true
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19090/-/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Prometheus did not become ready.' >&2
              docker compose logs backend prometheus >&2 || true
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U advance_trading -d advance_trading >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'PostgreSQL application readiness probe failed.' >&2
              docker compose logs postgres >&2 || true
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            clickhouse_ping="$(docker compose exec -T clickhouse wget -qO- http://127.0.0.1:8123/ping)"
            if [ "$clickhouse_ping" = 'Ok.' ] || [ "$clickhouse_ping" = 'Ok' ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'ClickHouse application readiness probe failed.' >&2
              docker compose logs clickhouse >&2 || true
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if docker compose exec -T redis redis-cli ping | grep -q '^PONG$'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Redis application readiness probe failed.' >&2
              docker compose logs redis >&2 || true
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if curl --fail --silent 'http://127.0.0.1:19090/api/v1/targets' > /tmp/prometheus-targets.json; then
              if python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/prometheus-targets.json').read_text())
          targets = payload['data']['activeTargets']
          backend = next(
              (
                  target
                  for target in targets
                  if target.get('labels', {}).get('job') == 'advance-trading-system'
              ),
              None,
          )
          if backend is not None:
              assert backend['health'] == 'up', backend
              assert backend['scrapeUrl'].endswith('/metrics'), backend
              raise SystemExit(0)
          raise SystemExit(1)
          PY
              then
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Prometheus backend scrape target did not become healthy.' >&2
              cat /tmp/prometheus-targets.json >&2 || true
              docker compose logs backend prometheus >&2 || true
              exit 1
            fi
            sleep 2
          done
